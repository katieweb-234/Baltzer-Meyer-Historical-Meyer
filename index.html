<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexsite</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="menu.png" alt="hamburger" />
        <img src="Baltzer_Meyer_Logo(white) copy.png" alt="Logo" />
        <h1>Baltzer Meyer Historical Society</h1>
        <div class="Button1">
          <button>Sign Up</button>
        </div>
      </div>
      <div class="landing_body">
        <p>
          Preserving the heritage of Old Westmoreland County for tomorrow’s
          generation
        </p>
      </div>
    </div>
    <div>
      <div class="Button2">
        <button>About</button>
      </div>
      <div class="Button3">
        <button>Library</button>
      </div>
    </div>
    <div>
      <div class="Button4">
        <button>Membership</button>
      </div>
    </div>
    <div>
      <div class="Button5">
        <button>More</button>
    </div>
  </body>
</html>
